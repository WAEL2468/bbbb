<title>TELECOMPARE.EG — أسعار 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">

:root{--vf:#E60026;--vf-bg:#fff0f2;--et:#007A3D;--et-bg:#e6f4ed;--or:#FF6600;--or-bg:#fff3eb;--we:#5B21B6;--we-bg:#f0ebff;--bg:#0a0a0f;--s1:#12121a;--s2:#1a1a26;--s3:#22222f;--b:rgba(255,255,255,.08);--b2:rgba(255,255,255,.16);--t:#f0f0f5;--t2:#9090a8;--t3:#5a5a72;--r:14px;--r2:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-size:18px;font-weight:700;letter-spacing:.5px;color:#fff}.logo b{color:var(--vf)}
.hdr-right{display:flex;align-items:center;gap:10px}
.tag{font-size:10px;background:#064e1e;color:#4ade80;padding:3px 10px;border-radius:20px;font-weight:700}
.langbtn{background:var(--s2);border:1px solid var(--b2);color:var(--t2);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s}
.langbtn:hover{color:#fff}
.tabs{background:var(--s1);border-bottom:1px solid var(--b);display:flex;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 13px;font-size:12px;font-weight:600;border:none;background:none;color:var(--t3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:'Cairo',sans-serif;display:flex;align-items:center;gap:5px;transition:color .15s}
.tab.on{color:#fff;border-bottom-color:var(--vf)}
.searchbar{padding:10px 12px;background:var(--s1);border-bottom:1px solid var(--b);display:flex;gap:8px}
.sinput{flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);padding:9px 14px;color:var(--t);font-size:13px;font-family:'Cairo',sans-serif;outline:none;transition:border-color .2s}
.sinput:focus{border-color:var(--vf)}
.sinput::placeholder{color:var(--t3)}
.sclr{background:var(--s2);border:1px solid var(--b2);color:var(--t2);border-radius:var(--r2);padding:9px 13px;cursor:pointer;font-size:13px;transition:all .2s}
.sclr:hover{color:#fff}
.frow{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;background:var(--s2);border-bottom:1px solid var(--b)}
.frow::-webkit-scrollbar{display:none}
.fpill{padding:5px 13px;border-radius:20px;border:1px solid var(--b2);background:var(--s3);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--t2);font-family:'Cairo',sans-serif;transition:all .15s}
.fpill.on{color:#fff;border-color:transparent}
.fpill[data-k="vf"].on{background:var(--vf)}.fpill[data-k="et"].on{background:var(--et)}.fpill[data-k="or"].on{background:var(--or)}.fpill[data-k="we"].on{background:var(--we)}.fpill[data-k="all"].on{background:#444}
.pfrow{display:flex;gap:6px;padding:7px 12px;overflow-x:auto;scrollbar-width:none;background:var(--s1);border-bottom:1px solid var(--b)}
.pfrow::-webkit-scrollbar{display:none}
.pfchip{padding:4px 11px;border-radius:20px;border:1px solid var(--b);background:var(--s2);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--t3);font-family:'Cairo',sans-serif;transition:all .15s}
.pfchip.on{background:var(--s3);color:var(--t);border-color:var(--b2)}
.main{padding:12px 12px 100px}
.grid{display:flex;flex-direction:column;gap:12px}
.card{background:var(--s1);border:1px solid var(--b);border-radius:var(--r);overflow:hidden;animation:fu .3s ease both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card.sel{border:2px solid #3b82f6}
.bestbadge{font-size:9px;font-weight:700;padding:3px 16px;text-align:center;letter-spacing:.06em}
.chead{padding:13px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--b)}
.cavatar{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.cname{font-size:15px;font-weight:700;color:#fff}
.cen{font-size:10px;color:var(--t3);margin-top:1px}
.csel{margin-right:auto;font-size:9px;font-weight:700;padding:2px 9px;border-radius:20px}
.scores{display:flex;border-bottom:1px solid var(--b)}
.sc{flex:1;padding:7px 4px;text-align:center;border-right:1px solid var(--b)}
.sc:last-child{border-right:none}
.slbl{font-size:9px;color:var(--t3);margin-bottom:1px}
.sval{font-size:12px;font-weight:700}
.sbar{height:2px;background:var(--s3);border-radius:1px;margin-top:3px;overflow:hidden}
.sfill{height:100%;border-radius:1px}
.blist{padding:10px 14px}
.btitle{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;border-bottom:1px solid var(--b);padding-bottom:5px}
.brow{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:6px}
.brow:last-child{border-bottom:none}
.bn{font-size:11px;font-weight:700;color:#fff;min-width:90px}
.bd{font-size:10px;color:var(--t2);flex:1;line-height:1.4}
.bcode{font-size:9px;color:var(--t3)}
.bspd{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;flex-shrink:0}
.bprices{text-align:left;flex-shrink:0}
.bp{font-size:12px;font-weight:700;white-space:nowrap}
.bptax{font-size:9px;color:var(--t3);white-space:nowrap}
.selbtn{margin:10px 14px 14px;padding:10px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--s2);font-size:13px;font-weight:700;cursor:pointer;color:var(--t2);width:calc(100% - 28px);font-family:'Cairo',sans-serif;transition:all .2s}
.selbtn:hover{background:var(--s3);color:#fff}
.selbtn.chosen{color:#fff;border-color:transparent}
.tbl-wrap{overflow-x:auto;border:1px solid var(--b);border-radius:var(--r)}
.cmptbl{width:100%;border-collapse:collapse;font-size:11px;min-width:420px}
.cmptbl th{padding:10px 8px;text-align:center;background:var(--s2);font-weight:700;font-size:12px;border-bottom:1px solid var(--b)}
.cmptbl th:first-child{text-align:right;color:var(--t2);min-width:100px}
.cmptbl td{padding:9px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);color:var(--t2)}
.cmptbl td:first-child{text-align:right;font-weight:600;color:var(--t3);background:var(--s2)}
.cmptbl tr:last-child td{border-bottom:none}
.cmptbl tr:nth-child(even) td:not(:first-child){background:rgba(255,255,255,.02)}
.tick{color:#22c55e;font-weight:700}.cross{color:#ef4444}
.bot{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(18,18,26,.97);backdrop-filter:blur(16px);border-top:1px solid var(--b);padding:10px 14px;display:flex;align-items:center;gap:10px}
.binfo{flex:1;font-size:12px;color:var(--t2)}
.cmpbtn{padding:10px 20px;background:var(--vf);border:none;color:#fff;border-radius:var(--r2);font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;white-space:nowrap}

.rtitle{font-size:15px;font-weight:700;margin-bottom:14px}
.rcard{border-radius:var(--r2);padding:13px;display:flex;gap:12px;margin-bottom:10px}

.rname{font-size:14px;font-weight:700}
.rsub{font-size:11px;color:var(--t2);margin-top:2px}
.rtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.notice{font-size:10px;color:var(--t3);background:var(--s2);border-radius:var(--r2);padding:10px 12px;margin-top:12px;border:1px solid var(--b);line-height:1.7}

@media(min-width:700px){.grid{display:grid;grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}

</head>

</div>

<div class="main">
  <div class="grid" id="grid"></div>
  <div class="result" id="result"></div>
</div>

<div class="bot">
  <div class="binfo" id="binfo"></div>
  <button class="cmpbtn" id="cmpbtn" onclick="showResult()"></button>
</div>

const CATNAMES={mobile:{ar:'باقات الموبايل',en:'Mobile Bundles'},vdsl:{ar:'إنترنت منزلي VDSL',en:'Home Internet VDSL'},flex:{ar:'باقات الفليكس / الوحدات',en:'Flex / Unit Plans'},mix:{ar:'الباقات المدمجة',en:'Mix & Combo Plans'}};
const SCNAMES={coverage:{ar:'تغطية',en:'Cov.'},speed:{ar:'سرعة',en:'Speed'},price:{ar:'قيمة',en:'Value'},service:{ar:'خدمة',en:'Serv.'}};
const BEST={mobile:'or',vdsl:'we',flex:'we',mix:'vf'};
const BESTREASON={mobile:{ar:'أرخص باقة موبايل 25 ج',en:'Cheapest 25 EGP'},vdsl:{ar:'أرخص VDSL في مصر',en:'Cheapest VDSL'},flex:{ar:'أرخص فليكس 30 ج',en:'Cheapest 30 EGP'},mix:{ar:'RED ESSENTIAL 450 ج',en:'RED ESSENTIAL 450 EGP'}};

let lang='ar',tab='mobile',opFilter='all',priceMin=0,priceMax=99999,picked=null;
const L=k=>typeof k==='object'?k[lang]:k;

function toggleLang(){
  lang=lang==='ar'?'en':'ar';
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('langbtn').textContent=lang==='ar'?'EN':'AR';
  document.getElementById('upd-tag').textContent=lang==='ar'?'يونيو 2026 ✓':'June 2026 ✓';
  document.getElementById('sinput').placeholder=lang==='ar'?'ابحث... مثلاً: 10GB أو VDSL أو 100':'Search... e.g. 10GB or VDSL or 100';
  document.querySelectorAll('.tl').forEach(el=>el.textContent=el.dataset[lang]);
  document.querySelectorAll('.fpill,[data-ar]').forEach(el=>{if(el.dataset[lang])el.textContent=el.dataset[lang];});
  renderGrid();
}

function setTab(tt,btn){
  tab=tt;picked=null;priceMin=0;priceMax=99999;opFilter='all';
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.fpill').forEach(b=>{b.classList.remove('on');if(b.dataset.k==='all')b.classList.add('on');});
  document.querySelectorAll('.pfchip').forEach((b,i)=>{b.classList.remove('on');if(i===0)b.classList.add('on');});
  const isSpecial=tt==='compare';
  ['searchbar','frow','pfrow'].forEach(id=>document.getElementById(id).style.display=isSpecial?'none':'flex');
  if(document.getElementById('sinput'))document.getElementById('sinput').value='';
  renderGrid();
}

function setOp(k,btn){
  opFilter=k;
  document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderGrid();
}

function setPrice(mn,mx,btn){
  priceMin=mn;priceMax=mx;
  document.querySelectorAll('.pfchip').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderGrid();
}

function clearSearch(){
  document.getElementById('sinput').value='';
  renderGrid();
}

function renderGrid(){
  const grid=document.getElementById('grid');
  document.getElementById('result').classList.remove('show');
  document.getElementById('binfo').textContent=picked?'':lang==='ar'?'اختر شبكة لمقارنتها':'Select an operator to compare';
  document.getElementById('cmpbtn').textContent=lang==='ar'?'عرض المقارنة ▶':'Show Comparison ▶';
  if(tab==='compare'){renderCompare();return;}
  const q=(document.getElementById('sinput').value||'').trim().toLowerCase();
  const keys=opFilter==='all'?Object.keys(OPS):[opFilter];
  let html='';
  keys.forEach((k,i)=>{
    const op=OPS[k];
    let bnd=(op.cats[tab]||[]).filter(b=>{
      const nm=lang==='ar'?b.n:b.ne;
      const dd=b.d[lang];
      return(!q||nm.toLowerCase().includes(q)||dd.toLowerCase().includes(q)||String(b.p).includes(q))&&b.p>=priceMin&&b.p<=priceMax;
    });
    if(!bnd.length)return;
    const isSel=picked===k,isBest=BEST[tab]===k;
    html+=`<div class="card${isSel?' sel':''}" style="animation-delay:${i*.06}s">
      ${isBest?`<div class="bestbadge" style="background:${op.color};color:#fff">⭐ ${L(BESTREASON[tab])}</div>`:''}
      <div class="chead">
        <div class="cavatar" style="background:${op.bg};color:${op.color}">${k==='et'?'e&':k.toUpperCase()}</div>
        <div style="flex:1"><div class="cname">${L(op.name)}</div><div class="cen">${L(op.sub)}</div></div>
        ${isSel?`<span class="csel" style="background:${op.bg};color:${op.color}">✓ ${lang==='ar'?'مختار':'Selected'}</span>`:''}
      </div>
      <div class="scores">${Object.keys(SCNAMES).map(s=>`<div class="sc"><div class="slbl">${L(SCNAMES[s])}</div><div class="sval" style="color:${op.color}">${op.score[s]}</div><div class="sbar"><div class="sfill" style="width:${op.score[s]}%;background:${op.color}"></div></div></div>`).join('')}</div>
      <div class="blist">
        <div class="btitle">${L(CATNAMES[tab])}</div>
        ${bnd.map(b=>`<div class="brow">
          <div class="bn">${lang==='ar'?b.n:b.ne}</div>
          <div class="bd">${b.d[lang]}${b.code?`<br><span class="bcode">${lang==='ar'?'كود:':'Code:'} ${b.code}</span>`:''}</div>
          ${b.s?`<span class="bspd" style="background:${op.bg};color:${op.color}">${b.s}</span>`:''}
          <div class="bprices">
            <div class="bp" style="color:${op.color}">${b.p} ${lang==='ar'?'ج':'EGP'}</div>
            <div class="bptax">${lang==='ar'?'بالضريبة:':'VAT:'} ${T14(b.p)}</div>
          </div>
        </div>`).join('')}
      </div>
      <button class="selbtn${isSel?' chosen':''}" style="${isSel?'background:'+op.color+';border-color:'+op.color:''}" onclick="pickOp('${k}')">
        ${isSel?(lang==='ar'?'✓ مختار — اضغط للإلغاء':'✓ Selected — tap to deselect'):(lang==='ar'?'اختر '+L(op.name):'Select '+L(op.name))}
      </button>
    </div>`;
  });
  grid.innerHTML=html||`<div class="noresult"><div style="font-size:36px;margin-bottom:10px">🔍</div><div style="font-size:14px;font-weight:700;color:var(--t2)">${lang==='ar'?'لا توجد نتائج':'No results found'}</div></div>`;
  if(picked)document.getElementById('binfo').innerHTML=`<span style="color:${OPS[picked].color};font-weight:700">${L(OPS[picked].name)}</span> ${lang==='ar'?'مختارة':'selected'}`;
}

function renderCompare(){
  const grid=document.getElementById('grid');
  const keys=Object.keys(OPS);
  const eg=lang==='ar'?'ج':'EGP';
  grid.innerHTML=`
  <div class="tbl-wrap">
    <table class="cmptbl">
      <thead><tr>
        <th>${lang==='ar'?'الميزة':'Feature'}</th>
        ${keys.map(k=>`<th style="color:${OPS[k].color}">${L(OPS[k].name)}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${[
          [lang==='ar'?'الشبكة':'Network','4G/5G','4G/5G','4G+','4G+'],
          ['5G','✓','✓',lang==='ar'?'محدود':'Limited','✗'],
          [lang==='ar'?'التغطية':'Coverage','95%','88%','85%','80%'],
          [lang==='ar'?'أرخص موبايل':'Cheapest mobile',`32 ${eg}`,`20 ${eg}`,`25 ${eg}`,`20 ${eg}`],
          [lang==='ar'?'بالضريبة 14%':'With VAT 14%',`36 ${eg}`,`23 ${eg}`,`29 ${eg}`,`23 ${eg}`],
          [lang==='ar'?'أرخص VDSL (بالضريبة)':'Cheapest VDSL (VAT inc)',`150 ${eg}`,`260 ${eg}`,`260 ${eg}`,`210 ${eg}`],
          [lang==='ar'?'VDSL غير محدود':'Unlimited VDSL',`1054 ${eg}`,lang==='ar'?'غير متاح':'N/A',lang==='ar'?'غير متاح':'N/A',`1550 ${eg}`],
          [lang==='ar'?'نظام الوحدات':'Unit system','Flex','Hekaya','Rasel/FreeMax','Control/Nitro'],
          [lang==='ar'?'5G متاح في':'5G in',lang==='ar'?'21 مدينة':'21 cities',lang==='ar'?'15 مدينة':'15 cities',lang==='ar'?'محدود':'Limited','✗'],
          [lang==='ar'?'WE TV مجاني':'Free WE TV','✗','✗','✗','✓'],
          [lang==='ar'?'التطبيق':'App','Ana Vodafone','My e& Egypt','My Orange','My WE'],
          [lang==='ar'?'الأنسب لـ':'Best for',lang==='ar'?'تغطية/5G':'Coverage/5G',lang==='ar'?'سرعة/جودة':'Speed/quality',lang==='ar'?'اقتصاد':'Budget',lang==='ar'?'VDSL/قيمة':'VDSL/value'],
        ].map((row,i)=>`<tr>
          <td>${row[0]}</td>
          ${keys.map((_,j)=>`<td class="${row[j+1]==='✓'?'tick':row[j+1]==='✗'?'cross':''}">${row[j+1]}</td>`).join('')}
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div class="notice">
    📅 <strong>${lang==='ar'?'الأسعار محدثة يونيو 2026':'Prices updated June 2026'}</strong><br>
    📌 ${lang==='ar'?'الأسعار قبل الضريبة — السعر بالضريبة (14%) موضح بجانب كل باقة.':'Prices before VAT — price with 14% VAT shown next to each bundle.'}<br>
    📰 ${lang==='ar'?'المصادر: المصري اليوم، sfegypt، مصر تايمز، شبكاتي، شباب العالم — مايو/يونيو 2026.':'Sources: Al-Masry Al-Youm, sfegypt, Masrtimes, shbkaty — May/June 2026.'}<br>
    ⚠️ ${lang==='ar'?'تحقق من التطبيق الرسمي للأسعار الدقيقة والعروض الحالية.':'Check the official app for exact current prices and offers.'}
  </div>`;
}

function pickOp(k){picked=picked===k?null:k;renderGrid();document.getElementById('result').classList.remove('show');}

function showResult(){
  if(!picked)return;
  const op=OPS[picked];
  const others=Object.keys(OPS).filter(k=>k!==picked);
  const avg=o=>Math.round(Object.values(o.score).reduce((a,b)=>a+b,0)/4);
  const r=document.getElementById('result');
  r.innerHTML=`
    <div class="rtitle">${lang==='ar'?'🏆 تقييم ':'🏆 Score: '}${L(op.name)}</div>
    <div class="rcard" style="background:${op.bg}22;border:1px solid ${op.color}44">
      <div class="ravatar" style="background:${op.bg};color:${op.color}">${op.k==='et'?'e&':op.k.toUpperCase()}</div>
      <div style="flex:1">
        <div class="rname" style="color:${op.color}">${L(op.name)}</div>
        <div class="rsub">${L(op.sub)}</div>
        <div class="rtags">
          ${Object.keys(SCNAMES).map(s=>`<span class="rtag" style="color:${op.color}">${L(SCNAMES[s])}: ${op.score[s]}%</span>`).join('')}
          <span class="rtag" style="color:${op.color};font-weight:700">${lang==='ar'?'متوسط:':'Avg:'} ${avg(op)}%</span>
        </div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--t2);margin:10px 0 6px">${lang==='ar'?'مقارنة مع الشبكات الأخرى:':'vs. other networks:'}</div>
    ${others.map(k=>{const o=OPS[k];const a=avg(o);return`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)">
      <div class="ravatar" style="width:32px;height:32px;font-size:10px;background:${o.bg};color:${o.color}">${k==='et'?'e&':k.toUpperCase()}</div>
      <div style="flex:1"><div style="font-size:12px;font-weight:700;color:var(--t2)">${L(o.name)}</div>
        <div style="height:3px;background:var(--s3);border-radius:2px;margin-top:4px;overflow:hidden">
          <div style="height:100%;width:${a}%;background:${o.color};border-radius:2px"></div>
        </div>
      </div>
      <span style="font-size:13px;font-weight:700;color:${o.color}">${a}%</span>
    </div>`;}).join('')}
    <div class="notice">📅 ${lang==='ar'?'أسعار محدثة يونيو 2026 من المواقع الرسمية والمصادر الموثوقة.':'Prices updated June 2026 from official sites and trusted sources.'}</div>`;
  r.classList.add('show');
  setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

document.getElementById('sinput').placeholder='ابحث... مثلاً: 10GB أو VDSL أو 100';
document.getElementById('binfo').textContent='اختر شبكة لمقارنتها';
document.getElementById('cmpbtn').textContent='عرض المقارنة ▶';
renderGrid();
